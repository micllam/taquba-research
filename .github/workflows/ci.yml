name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --features aws --all-targets --locked -- -D warnings
      # The feature set of docs.rs, from `package.metadata.docs.rs`.
      - run: cargo doc --features aws --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Every feature of the crate must be built by a job of this file.
      - name: check that every feature is built
        run: |
          set -euo pipefail
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "taquba-research") | .features | keys[]' \
            | grep -v '^default$')
          for feature in $features; do
            grep -qE -- "--features $feature( |\$)" .github/workflows/ci.yml \
              || { echo "no job of ci.yml builds feature '$feature'" >&2; exit 1; }
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
      - run: cargo test --locked

  # The cloud features are mutually exclusive, so each one is built on its own.
  features:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: aws
            args: --features aws
          - name: gcp
            args: --features gcp
          - name: azure
            args: --features azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: features
      - run: cargo check --all-targets --locked ${{ matrix.args }}
