[package]
name = "taquba-research"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Durable Rust research agent built on Rig and taquba-workflow."
repository = "https://github.com/micllam/taquba-research"
homepage = "https://github.com/micllam/taquba-research"
readme = "README.md"
keywords = ["agent", "research", "rig", "taquba", "durable"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
# The in-memory and local-disk stores work without a feature. A cloud build
# enables exactly one of the cloud features, which mirror the mutually exclusive
# cloud feature flags of taquba.
default = []
aws = ["taquba/aws"]
gcp = ["taquba/gcp"]
azure = ["taquba/azure"]

[lib]
name = "taquba_research"
path = "src/lib.rs"

[[bin]]
name = "taquba-research"
path = "src/bin/taquba_research.rs"

[package.metadata.docs.rs]
# docs.rs builds with one cloud backend enabled.
features = ["aws"]

[dependencies]
taquba = "0.14"
taquba-workflow = "0.13"
rig-core = { version = "0.43", features = ["reqwest"] }
rig-agent = "0.43"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
anyhow = "1"
dirs = "5"
futures-util = { version = "0.3", default-features = false }
schemars = "1"
html2text = "0.17"

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]`, the paused clock of
# the tests of the polling and timeout paths of the runner.
tokio = { version = "1", features = ["test-util"] }
# `CancellationToken` for constructing `taquba_workflow::Step` in tests.
tokio-util = { version = "0.7", default-features = false }
